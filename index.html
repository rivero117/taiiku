<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音当てゲーム</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding: 50px;
    }

    input {
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      font-size: 28px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>この和音は何？</h1>

<button onclick="playChord()">和音を再生</button><br>

<input type="text" id="answer" placeholder="ドとミみたいに書いてね🍝">
<button onclick="check()">判定</button>

<div id="result"></div>

<script>
let audioCtx;

function playChord() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // ファ#（F#4 ≒ 370Hz）とラ（A4 = 440Hz）
  const freqs = [370, 440];

  freqs.forEach(freq => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.frequency.value = freq;
    osc.type = "sine";

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

    osc.start();
    osc.stop(audioCtx.currentTime + 1.5);
  });
}

function check() {
  let input = document.getElementById("answer").value.trim();

  // 表記ゆれ対策
  input = input
    .toLowerCase()
    .replace(/♯/g, "#")
    .replace(/\s+/g, "");

  const result = document.getElementById("result");

  if (
    input === "ファ#とラ" ||
    input === "ファ#ラ" ||
    input === "f#a" ||
    input === "f#とa"
  ) {
    result.textContent = "CLEAR";
  } else {
    result.textContent = "ONE MORE TRY";
  }
}
</script>

</body>
</html>
