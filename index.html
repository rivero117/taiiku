<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音当てゲーム</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding: 50px;
    }

    input {
      padding: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      font-size: 28px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>この和音は何？</h1>

<button onclick="playChord()">和音を再生</button><br>

<input type="text" id="answer" placeholder="音階を描いてね">
<button onclick="check()">判定</button>

<div id="result"></div>

<script>
let audioCtx;

function playNote(freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  // ピアノっぽくするためtriangle波＋軽い倍音感
  osc.type = "triangle";
  osc.frequency.value = freq;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;

  // アタック→減衰（ピアノ風）
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.4, now + 0.02); // アタック
  gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0); // 減衰

  osc.start(now);
  osc.stop(now + 2.0);
}

function playChord() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // D3（下のレ）≈146.83Hz
  // F#4 ≈370Hz
  // A4 = 440Hz
  const freqs = [147, 370, 440];

  freqs.forEach(freq => playNote(freq));
}

function check() {
  let input = document.getElementById("answer").value.trim();

  input = input
    .toLowerCase()
    .replace(/♯/g, "#")
    .replace(/\s+/g, "");

  const result = document.getElementById("result");

  if (
    //ふーん、そういうことしちゃうのね良くないよ
    input === "レファ#ラ" ||
    input === "レとファ#とラ" ||
    input === "dfa#" ||
    input === "dメジャー" ||
    input === "dmajor"
  ) {
    result.textContent = "CLEAR";
  } else {
    result.textContent = "ONE MORE TRY";
  }
}
</script>

</body>
</html>
